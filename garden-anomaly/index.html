const renderer = new THREE.WebGPURenderer({ antialias: true });

const scene = new THREE.Scene();
// vertical gradient backdrop, rebuildable from the pane
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 4; bgCanvas.height = 512;
const bgTex = new THREE.CanvasTexture(bgCanvas);
bgTex.colorSpace = THREE.SRGBColorSpace;
function rebuildBg() {
  const g = bgCanvas.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, prm.bgTop);
  grad.addColorStop(1, prm.bgBot);
  g.fillStyle = grad; g.fillRect(0, 0, 4, 512);
  bgTex.needsUpdate = true;
  document.body.style.background = `linear-gradient(${prm.bgTop}, ${prm.bgBot})`;
}
rebuildBg();
scene.background = bgTex;

const ENV_URL = './equiRectGarden.jpg'; // set to '' to always keep the gradient
function useEnvmap(t) {
  t.mapping = THREE.EquirectangularReflectionMapping;
  scene.background = t;

}
if (ENV_URL) {
  try {
    if (/\.hdr$/i.test(ENV_URL)) {
      const { HDRLoader } = await import('three/addons/loaders/HDRLoader.js');
      new HDRLoader().load(ENV_URL, useEnvmap, undefined, () => {});
    } else {
      new THREE.TextureLoader().load(ENV_URL, t => { t.colorSpace = THREE.SRGBColorSpace; useEnvmap(t); }, undefined, () => {});
    }
  } catch (e) { /* keep gradient */ }
}

const uGlowCol = uniform(new THREE.Color(prm.glowColor));
const uGlowA   = uniform(prm.glowAlpha);
const uShadA   = uniform(prm.shadowAlpha);

const gd = uv().sub(0.5).length().mul(2); // 0 center → 1 edge
const radialA = smoothstep(1.0, 0.15, gd).mul(pow(smoothstep(1.0, 0.0, gd), 1.5));

const glowMat = new THREE.MeshBasicNodeMaterial();
glowMat.transparent = true;
glowMat.depthWrite = false;
glowMat.colorNode = vec4(vec3(uGlowCol), radialA.mul(uGlowA));
const glow = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 4.6), glowMat);
glow.position.set(0, -0.35, -1.2);
glow.renderOrder = -2;
scene.add(glow);

const shadMat = new THREE.MeshBasicNodeMaterial();
shadMat.transparent = true;
shadMat.depthWrite = false;
shadMat.depthTest = false;
const uShadCol = uniform(new THREE.Color(prm.shadowColor));
shadMat.colorNode = vec4(vec3(uShadCol), radialA.mul(uShadA));
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3.7, 1.5), shadMat);
shadow.position.set(0, -1.42, 0);
shadow.renderOrder = 20;

scene.add(shadow);



// ═══════════════════════════════════════════════════════════════════
//  glass shell
// ═══════════════════════════════════════════════════════════════════

const N_BULGE = 8;
const bulgeVecs = Array.from({ length: N_BULGE }, () => new THREE.Vector4(0, 1, 0, 0)); // xyz dir, w amp
const uBulges = uniformArray(bulgeVecs);
const uBulgeSharp = uniform(prm.bulgeSharp);

const shellMat = new THREE.MeshPhysicalNodeMaterial({
  transmission: 1.0,
  thickness: prm.thickness,
  ior: prm.ior,
  roughness: prm.roughness,
  metalness: 0,
  iridescence: prm.irid,
  iridescenceIOR: prm.iridIor,
  iridescenceThicknessRange: [140, 380],
  clearcoat: 1.0,
  clearcoatRoughness: 0.10,
  specularIntensity: 1.0,
  envMapIntensity: prm.envInt,
  attenuationColor: new THREE.Color(prm.attColor),
  attenuationDistance: prm.attDist,
});

{
  const uDentAO  = uniform(prm.dentAO);
  const uDentNrm = uniform(prm.dentNrm);
  window.__dentU = { uDentAO, uDentNrm }; // pane hookup below

  // bump field B(n̂) = Σ A·max(n̂·d,0)^s and its tangential gradient
  // ∇(u^s) = s·u^(s-1)·(d − n̂·u)/R  — evaluated per-stage from positionGeometry
  const buildBump = () => {
    const nrm = normalize(positionGeometry);
    let bump = float(0);
    let grad = vec3(0, 0, 0);
    for (let k = 0; k < N_BULGE; k++) {
      const b = uBulges.element(k);
      const u = max(nrm.dot(b.xyz), 0.0);
      bump = bump.add(b.w.mul(pow(u, uBulgeSharp)));
      grad = grad.add(
        b.xyz.sub(nrm.mul(u))
          .mul(b.w.mul(uBulgeSharp).mul(pow(u, uBulgeSharp.sub(1))))
      );
    }
    return { nrm, bump, grad: grad.div(SHELL_R) };
  };

  // vertex: displace outward
  const v = buildBump();
  shellMat.positionNode = positionGeometry.add(v.nrm.mul(v.bump));

  // fragment: per-pixel perturbed normal — highlights and refraction bend
  // across the dent — plus AO-style darkening scaled by bump height
  const f = buildBump();
  // ice normal map in a sphere tangent frame, combined with the dent gradient
  const normalTex = new THREE.TextureLoader().load(NORMAL_B64);
  normalTex.wrapS = normalTex.wrapT = THREE.RepeatWrapping;
  const uNrmScale = uniform(prm.nrmScale);
  window.__nrmU = { uNrmScale };
  const tN = texture(normalTex, uv().mul(2)).xyz.mul(2).sub(1); // tiled 2x
  const T = normalize(cross(vec3(0, 1, 0), f.nrm).add(vec3(1e-4, 0, 0)));
  const B = cross(f.nrm, T);
  shellMat.normalNode = transformNormalToView(normalize(
    f.nrm.mul(tN.z)
      .add(T.mul(tN.x.mul(uNrmScale)))
      .add(B.mul(tN.y.mul(uNrmScale)))
      .sub(f.grad.mul(uDentNrm))
  ));
  const ao = exp(f.bump.mul(uDentAO).negate());
  shellMat.colorNode = vec3(ao);
  shellMat.aoNode = ao;

  // wandering white scanlines — canvas-generated strip in the emissive channel
  const c = document.createElement('canvas');
  c.width = 4; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 4, 1024);
  const drawLine = (y, h, a) => {
    g.fillStyle = `rgba(255,255,255,${a})`;
    g.fillRect(0, y, 4, h); // hard-edged; texture filtering supplies the AA
  };
  for (let i = 0; i < 22; i++) {
    const y = Math.random() * 1024;
    const h = 1 + Math.random() * 3;       // thin: 1–4px of 1024
    const a = 0.35 + Math.random() * 0.65;
    drawLine(y, h, a);
    drawLine(y - 1024, h, a); // seamless wrap
    drawLine(y + 1024, h, a);
  }
  const scanTex = new THREE.CanvasTexture(c);
  scanTex.wrapS = scanTex.wrapT = THREE.RepeatWrapping;
  scanTex.colorSpace = THREE.SRGBColorSpace;

  const uScan = uniform(0);
  const uScanInt = uniform(prm.scanInt);
  window.__scanU = { uScan, uScanInt };
  shellMat.emissiveNode = vec3(texture(scanTex, uv().add(vec2(0, uScan))).r).mul(uScanInt);

  // chunky-ice roughness map (embedded), modulated by the roughness slider
  const roughTex = new THREE.TextureLoader().load(ROUGH_B64);
  roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;
  const uRoughMul = uniform(prm.roughness);
  window.__roughU = { uRoughMul };
  shellMat.roughnessNode = texture(roughTex, uv()).r.mul(uRoughMul).mul(2);
}
const shell = new THREE.Mesh(new THREE.SphereGeometry(SHELL_R, 96, 96), shellMat);
scene.add(shell);



// ═══════════════════════════════════════════════════════════════════
//  blob(s)
//  !!! must be opaque — the transmission pass only 
//  captures opaque geometry !!!
// ═══════════════════════════════════════════════════════════════════

const blobMat = new THREE.MeshPhysicalMaterial({
  roughness: prm.blobRough,
  metalness: 0,
  clearcoat: prm.blobCoat,
  clearcoatRoughness: 0.25,
  envMapIntensity: 0.55,
});
blobMat.transparent = false;

const blobGeo = new THREE.SphereGeometry(1, 32, 32);
const blobs = new THREE.InstancedMesh(blobGeo, blobMat, N_BLOBS);
blobs.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(blobs);



// ═══════════════════════════════════════════════════════════════════
//  sim state
// ═══════════════════════════════════════════════════════════════════

const P  = new Float32Array(N_BLOBS * 3);  // position
const Pp = new Float32Array(N_BLOBS * 3);  // previous position (PBD)
const V  = new Float32Array(N_BLOBS * 3);  // velocity
const R  = new Float32Array(N_BLOBS);      // radius
const touch = new Uint8Array(N_BLOBS);     // in-contact flag (this frame)
const wallPrev = new Uint8Array(N_BLOBS);  // was touching the glass last frame
const rushCd = new Float32Array(N_BLOBS);  // collision-rescatter cooldown
const rushPow = new Float32Array(N_BLOBS); // pending rescatter impact power



// ═══════════════════════════════════════════════════════════════════
//  bulge slots: A = impact amplitude, 
//  age drives an attack/release envelope
// ═══════════════════════════════════════════════════════════════════

const bulgeA = new Float32Array(N_BULGE);
const bulgeAge = new Float32Array(N_BULGE);

const _bq = new THREE.Quaternion();
const _bv = new THREE.Vector3();
function spawnBulge(nx, ny, nz, amp) {
  // the shell rotates: store the dent in its LOCAL frame so it rides the
  // glass like real material deformation instead of drifting across it
  _bv.set(nx, ny, nz).applyQuaternion(_bq.copy(shell.quaternion).invert());
  nx = _bv.x; ny = _bv.y; nz = _bv.z;
  let k = 0, best = Infinity; // reuse the most faded slot
  for (let s = 0; s < N_BULGE; s++) {
    const cur = bulgeA[s] * Math.exp(-bulgeAge[s] * prm.bulgeRel);
    if (cur < best) { best = cur; k = s; }
  }
  bulgeVecs[k].set(nx, ny, nz, 0);
  bulgeA[k] = amp;
  bulgeAge[k] = 0;
}

function updateBulges(dt) {
  for (let k = 0; k < N_BULGE; k++) {
    bulgeAge[k] += dt;
    // smooth ease-in (attack 18/s ≈ 0.1s) and exponential relax-back
    const amp = bulgeA[k]
      * (1 - Math.exp(-bulgeAge[k] * 18))
      * Math.exp(-bulgeAge[k] * prm.bulgeRel);
    bulgeVecs[k].w = amp;
  }
}

const colDeep = new THREE.Color(prm.colorDeep);
const colLight = new THREE.Color(prm.colorLight);
const tint = new Float32Array(N_BLOBS);   // per-blob deep light mix
const restT = new Float32Array(N_BLOBS);  // time spent at rest
const _c = new THREE.Color();
const _m = new THREE.Matrix4();

function applyColors() {
  colDeep.set(prm.colorDeep);
  colLight.set(prm.colorLight);
  for (let i = 0; i < N_BLOBS; i++) {
    _c.copy(colDeep).lerp(colLight, tint[i]);
    blobs.setColorAt(i, _c);
  }
  blobs.instanceColor.needsUpdate = true;
}

function seed() {
  for (let i = 0; i < N_BLOBS; i++) {
    // mostly tiny, a few large
    R[i] = 0.045 + Math.pow(Math.random(), 2.4) * 0.20;
    // rain in from the upper half, staggered so they land one after another
    const a = Math.random() * Math.PI * 2;
    const rr = Math.sqrt(Math.random()) * 0.7;
    P[i * 3 + 0] = Math.cos(a) * rr;
    P[i * 3 + 1] = 0.2 + Math.random() * 0.95;
    P[i * 3 + 2] = Math.sin(a) * rr;
    V[i * 3] = V[i * 3 + 1] = V[i * 3 + 2] = 0;
    tint[i] = Math.pow(Math.random(), 0.8);
    restT[i] = 0;
    _m.makeScale(R[i], R[i], R[i]);
    _m.setPosition(P[i * 3], P[i * 3 + 1], P[i * 3 + 2]);
    blobs.setMatrixAt(i, _m); // all matrices valid before first render
  }
  blobs.instanceMatrix.needsUpdate = true;
  applyColors();
}

seed();



// ═══════════════════════════════════════════════════════════════════
//  sim step (PBD, 64 blobs)
// ═══════════════════════════════════════════════════════════════════

function step(dt) {
  const inner = SHELL_R - 0.04;
  const damp = Math.exp(-prm.damp * dt);
  const invDt = 1 / dt;

  // predict
  for (let i = 0; i < N_BLOBS; i++) {
    const ix = i * 3;
    Pp[ix] = P[ix]; Pp[ix + 1] = P[ix + 1]; Pp[ix + 2] = P[ix + 2];
    V[ix + 1] -= prm.gravity * dt;
    V[ix] *= damp; V[ix + 1] *= damp; V[ix + 2] *= damp;
    P[ix]     += V[ix]     * dt;
    P[ix + 1] += V[ix + 1] * dt;
    P[ix + 2] += V[ix + 2] * dt;
    touch[i] = 0;
    if (rushCd[i] > 0) rushCd[i] -= dt;
  }

  // wall-impact detection (before constraints eat the velocity):
  // a blob newly reaching the glass with real outward speed dents it outward
  for (let i = 0; i < N_BLOBS; i++) {
    const ix = i * 3;
    const pr = Math.hypot(P[ix], P[ix + 1], P[ix + 2]);
    const maxR = SHELL_R - 0.04 - R[i];
    const atWall = pr > maxR ? 1 : 0;
    if (atWall && !wallPrev[i] && pr > 1e-5) {
      const nx = P[ix] / pr, ny = P[ix + 1] / pr, nz = P[ix + 2] / pr;
      const vn = V[ix] * nx + V[ix + 1] * ny + V[ix + 2] * nz;
      if (vn > 0.45) {
        const amp = Math.min(vn, 3.5) * prm.bulgeAmt * (0.4 + R[i] * 2.5);
        spawnBulge(nx, ny, nz, amp);
        playHit((R[i] - 0.045) / 0.20, vn, P[ix]);
      }
    }
    wallPrev[i] = atWall;
  }

  // project constraints: blob-blob separation (mass-weighted) + glass wall
  for (let it = 0; it < 3; it++) {
    for (let i = 0; i < N_BLOBS; i++) {
      const ix = i * 3;
      for (let j = i + 1; j < N_BLOBS; j++) {
        const jx = j * 3;
        const dx = P[ix] - P[jx], dy = P[ix + 1] - P[jx + 1], dz = P[ix + 2] - P[jx + 2];
        const d = Math.hypot(dx, dy, dz);
        const minD = R[i] + R[j];
        if (d < minD && d > 1e-5) {
          touch[i] = touch[j] = 1;
          const mi = R[i] ** 3, mj = R[j] ** 3;
          const wi = mj / (mi + mj), wj = mi / (mi + mj);
          const ov = (minD - d) / d;
          P[ix] += dx * ov * wi; P[ix + 1] += dy * ov * wi; P[ix + 2] += dz * ov * wi;
          P[jx] -= dx * ov * wj; P[jx + 1] -= dy * ov * wj; P[jx + 2] -= dz * ov * wj;
          if (it === 0) {
            // energetic impact? queue a random rescatter for both balls
            // (applied AFTER velocity derivation — PBD would overwrite it here)
            const vn = ((V[ix] - V[jx]) * dx + (V[ix + 1] - V[jx + 1]) * dy + (V[ix + 2] - V[jx + 2]) * dz) / d;
            if (vn < -1.1) {
              const pow_ = Math.min(-vn, 4);
              if (rushCd[i] <= 0) { rushPow[i] = Math.max(rushPow[i], pow_); rushCd[i] = 0.18; }
              if (rushCd[j] <= 0) { rushPow[j] = Math.max(rushPow[j], pow_); rushCd[j] = 0.18; }
            }
          }
        }
      }
    }
    for (let i = 0; i < N_BLOBS; i++) {
      const ix = i * 3;
      const pr = Math.hypot(P[ix], P[ix + 1], P[ix + 2]);
      const maxR = SHELL_R - 0.04 - R[i];
      if (pr > maxR) {
        touch[i] = 1;
        const f = maxR / pr;
        P[ix] *= f; P[ix + 1] *= f; P[ix + 2] *= f;
      }
    }
  }

  // derive velocity from what actually happened; contact damping settles
  // the pile and doubles as glass friction
  const cd = Math.exp(-prm.friction * dt);
  for (let i = 0; i < N_BLOBS; i++) {
    const ix = i * 3;
    V[ix]     = (P[ix]     - Pp[ix])     * invDt;
    V[ix + 1] = (P[ix + 1] - Pp[ix + 1]) * invDt;
    V[ix + 2] = (P[ix + 2] - Pp[ix + 2]) * invDt;
    if (touch[i]) { V[ix] *= cd; V[ix + 1] *= cd; V[ix + 2] *= cd; }

    // collision rescatter: force a direction change + repowered random rush
    if (rushPow[i] > 0) {
      const own = Math.hypot(V[ix], V[ix + 1], V[ix + 2]);
      const spd = Math.min(Math.max(own * 0.6 + rushPow[i] * 0.55, 0.6), 4.5);
      const ra = Math.random() * Math.PI * 2;
      const ry = Math.random() * 1.3 - 0.3;              // mostly up, a little down allowed
      const rh = Math.sqrt(Math.max(1 - ry * ry, 0.05));
      V[ix]     = Math.cos(ra) * rh * spd;
      V[ix + 1] = ry * spd;
      V[ix + 2] = Math.sin(ra) * rh * spd;
      rushPow[i] = 0;
    }

    // invisible force: resting longer than blowDelay gets blown back up
    const spd = Math.hypot(V[ix], V[ix + 1], V[ix + 2]);
    if (spd < 0.15) restT[i] += dt; else restT[i] = 0;
    if (restT[i] > prm.blowDelay) {
      restT[i] = 0;
      const bp = prm.blowPow * (0.7 + Math.random() * 0.8);
      const ba = Math.random() * Math.PI * 2;
      const bh = 0.2 + Math.random() * 0.55;             // some sideways drift
      V[ix]     += Math.cos(ba) * bh * bp;
      V[ix + 1] += bp * (0.8 + Math.random() * 0.5);     // dominant up-blast
      V[ix + 2] += Math.sin(ba) * bh * bp;
    }

    _m.makeScale(R[i], R[i], R[i]);
    _m.setPosition(P[ix], P[ix + 1], P[ix + 2]);
    blobs.setMatrixAt(i, _m);
  }
  blobs.instanceMatrix.needsUpdate = true;
}



// ═══════════════════════════════════════════════════════════════════
//  sound(s)
// ═══════════════════════════════════════════════════════════════════

const SND = { ctx: null, master: null, last: 0, voices: 0 };
function ensureAudio() {
  if (SND.ctx) { if (SND.ctx.state === 'suspended') SND.ctx.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  SND.ctx = new C();
  const ctx = SND.ctx;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 6;
  comp.connect(ctx.destination);
  SND.master = ctx.createGain();
  SND.master.gain.value = prm.sndVol;
  // flanger bus: dry + LFO-modulated short delay with gentle feedback
  const dry = ctx.createGain(); dry.gain.value = 0.75;
  const wet = ctx.createGain(); wet.gain.value = 0.55;
  const dl = ctx.createDelay(0.03); dl.delayTime.value = 0.0045;
  const fb = ctx.createGain(); fb.gain.value = 0.35;
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.45;
  const lfoAmt = ctx.createGain(); lfoAmt.gain.value = 0.0018;
  lfo.connect(lfoAmt); lfoAmt.connect(dl.delayTime); lfo.start();
  SND.master.connect(dry); dry.connect(comp);
  SND.master.connect(dl); dl.connect(fb); fb.connect(dl);
  dl.connect(wet); wet.connect(comp);
}
const PENTA = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 784.00, 880.00];
function playHit(size01, vel, x) {
  if (!prm.sndOn || !SND.ctx || SND.ctx.state !== 'running') return;
  const t = SND.ctx.currentTime;
  if (t - SND.last < 0.05 || SND.voices > 8) return; // rate limit
  SND.last = t; SND.voices++;
  const f = PENTA[Math.max(0, Math.min(9, Math.floor((1 - size01) * 9.99)))];
  const vol = Math.min(vel / 3, 1) * 0.7;
  const p = SND.ctx.createStereoPanner();
  p.pan.value = Math.max(-1, Math.min(1, x / 1.3)) * 0.8;
  p.connect(SND.master);
  // consonant partial stack: fundamental, fifth, octave, twelfth
  const partials = [
    [1.0, 1.0, 0.60], [1.5, 0.32, 0.45], [2.0, 0.28, 0.40], [3.0, 0.10, 0.25],
  ];
  let ended = 0;
  for (const [ratio, amp, dur] of partials) {
    const o = SND.ctx.createOscillator();
    const g = SND.ctx.createGain();
    o.type = 'sine';
    if (ratio === 1.0) {
      o.frequency.setValueAtTime(f * 1.05, t);           // soft droop = boing
      o.frequency.exponentialRampToValueAtTime(f, t + 0.10);
    } else o.frequency.value = f * ratio;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(vol * amp, 0.001), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(p);
    o.start(t); o.stop(t + dur + 0.05);
    o.onended = () => { if (++ended === partials.length) SND.voices--; };
  }
}



// ═══════════════════════════════════════════════════════════════════
//  pointer fling
// ═══════════════════════════════════════════════════════════════════

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const ndcPrev = new THREE.Vector2();
const camRight = new THREE.Vector3();
const camUp = new THREE.Vector3();
const _w = new THREE.Vector3();
let havePrev = false;
let flingDrag = false;

function toNdc(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
}

function rayDist(i, o, dir) {
  const ix = i * 3;
  const px = P[ix] - o.x, py = P[ix + 1] - o.y, pz = P[ix + 2] - o.z;
  const t = px * dir.x + py * dir.y + pz * dir.z;
  const cx = px - dir.x * t, cy = py - dir.y * t, cz = pz - dir.z * t;
  return Math.hypot(cx, cy, cz);
}

function fling(dxN, dyN) {
  const speed = Math.hypot(dxN, dyN);
  if (speed < 0.0005) return;
  ray.setFromCamera(ndc, camera);
  camera.matrixWorld.extractBasis(camRight, camUp, _w);
  const o = ray.ray.origin, dir = ray.ray.direction;
  for (let i = 0; i < N_BLOBS; i++) {
    // generous pad — airborne balls stay easy to hit again mid-flight
    if (rayDist(i, o, dir) < R[i] + 0.14) {
      const ix = i * 3;
      const k = prm.throwPow * Math.min(speed * 30, 3) / Math.max(R[i] / 0.09, 0.6);
      // each ball rushes off in its own random direction; the swipe only
      // steers lightly. Vertical is always upward — down is the rest state.
      const ra = Math.random() * Math.PI * 2;
      const rmag = k * (3 + Math.random() * 10);
      V[ix]     += Math.cos(ra) * rmag + (camRight.x * dxN + camUp.x * dyN) * k * 4;
      V[ix + 1] += k * (0.8 + Math.random() * 2.7);
      V[ix + 2] += Math.sin(ra) * rmag + (camRight.z * dxN + camUp.z * dyN) * k * 4;
    }
  }
}

addEventListener('pointerdown', (e) => {
  ensureAudio();
  toNdc(e);
  ndcPrev.copy(ndc);
  havePrev = true;
  // touching a bubble claims the gesture for flinging instead of orbiting
  ray.setFromCamera(ndc, camera);
  const o = ray.ray.origin, dir = ray.ray.direction;
  for (let i = 0; i < N_BLOBS; i++) {
    if (rayDist(i, o, dir) < R[i] + 0.14) { flingDrag = true; break; }
  }
  controls.enabled = !flingDrag;
});

addEventListener('pointermove', (e) => {
  toNdc(e);
  if (!havePrev) { ndcPrev.copy(ndc); havePrev = true; return; }
  const dxN = ndc.x - ndcPrev.x, dyN = ndc.y - ndcPrev.y;
  ndcPrev.copy(ndc);
  if (e.buttons === 0 || flingDrag) fling(dxN, dyN);
});

const endGesture = () => { flingDrag = false; controls.enabled = true; };
addEventListener('pointerup', endGesture);
addEventListener('pointercancel', endGesture);

const timer = new THREE.Timer();
const _back = new THREE.Vector3();
const _bx = new THREE.Vector3(), _by = new THREE.Vector3(), _bz = new THREE.Vector3();
let firstFrame = true;

renderer.setAnimationLoop(() => {
  timer.update();
  const rdt = Math.min(timer.getDelta(), 1 / 30);
  const dt = rdt * prm.simSpeed;
  if (dt > 0) { step(dt); updateBulges(dt); }
  shell.rotation.y += prm.rotY * rdt; // constant spin, independent of simSpeed
  shell.rotation.x += prm.rotX * rdt;
  window.__scanU.uScan.value = (window.__scanU.uScan.value + prm.scanSpeed * dt) % 1;

  // halo behind the sphere along the view direction; the shadow is anchored
  // in SCREEN space: positioned along the camera's screen-down axis from the
  // sphere center and screen-aligned — same spot just below the glass from
  // every camera angle, never tilting, never drifting onto the sphere
  camera.getWorldDirection(_back);
  glow.position.set(0, -0.35, 0).addScaledVector(_back, 1.2);
  glow.quaternion.copy(camera.quaternion);
  camera.matrixWorld.extractBasis(_bx, _by, _bz);
  shadow.position.copy(_by).multiplyScalar(-1.42); // screen-down from center
  shadow.quaternion.copy(camera.quaternion);
  controls.update();
  pipeline.render();

  if(firstFrame){ firstFrame=false; document.getElementById('loader').classList.add('hidden'); }
});
</script>
</body>

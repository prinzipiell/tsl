const ENV_SRC = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/venice_sunset_1k.hdr';
let pmremGen, environmentTarget, environmentTexture;
async function loadEnvironment() {

// ═══════════════════════════════════════════════════════════════════
//  faceted geometry
// ═══════════════════════════════════════════════════════════════════

const SUB = 18;
const RADIUS = 0.98;

function buildPolyhedron(radius, sub, shape = 'dodecahedron') {
  const Ctor = shape === 'icosahedron'
    ? THREE.IcosahedronGeometry
    : THREE.DodecahedronGeometry;
  const base = new Ctor(radius, 0);
  const bp = base.getAttribute('position');
  const P = [];
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  const e1 = new THREE.Vector3(), e2 = new THREE.Vector3();
  const vert = (i, j) => new THREE.Vector3().copy(A).addScaledVector(e1, i / sub).addScaledVector(e2, j / sub);
  for (let f = 0; f < bp.count; f += 3) {
    A.fromBufferAttribute(bp, f);
    B.fromBufferAttribute(bp, f + 1);
    C.fromBufferAttribute(bp, f + 2);
    e1.subVectors(B, A);
    e2.subVectors(C, A);
    for (let i = 0; i < sub; i++) {
      for (let j = 0; j < sub - i; j++) {
        const p0 = vert(i, j), p1 = vert(i + 1, j), p2 = vert(i, j + 1);
        P.push(p0.x, p0.y, p0.z, p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
        if (j < sub - i - 1) {
          const q0 = vert(i + 1, j), q1 = vert(i + 1, j + 1), q2 = vert(i, j + 1);
          P.push(q0.x, q0.y, q0.z, q1.x, q1.y, q1.z, q2.x, q2.y, q2.z);
        }
      }
    }
  }
  base.dispose();
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  return g;
}



// ═══════════════════════════════════════════════════════════════════
//  shell geometry
// ═══════════════════════════════════════════════════════════════════

let ROUND = 0.15;

function makeShellGeometry(shape, round = ROUND) {
  let g = buildPolyhedron(RADIUS, SUB, shape);
  g = mergeVertices(g, 1e-5);



  // ═══════════════════════════════════════════════════════════════════
  //  rounded edges
  // ═══════════════════════════════════════════════════════════════════

  const pos = g.getAttribute('position');
  const v = new THREE.Vector3(), sph = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    sph.copy(v).normalize().multiplyScalar(RADIUS);
    v.lerp(sph, round);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  pos.needsUpdate = true;
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}

let geometry = makeShellGeometry('dodecahedron');



// ═══════════════════════════════════════════════════════════════════
//  glass material
// ═══════════════════════════════════════════════════════════════════

const material = new THREE.MeshPhysicalNodeMaterial({

  metalness: 0.0,
  transmission: 1.0,

const uRipWidth  = uniform(6.0);
const uRipFreq   = uniform(9.0);
const uRipDecay  = uniform(2.6);
const uNormalAmt = uniform(0.7);

scene.add(ball);



// ═══════════════════════════════════════════════════════════════════
//  liquid volume
// ═══════════════════════════════════════════════════════════════════

const LIQ_R = RADIUS * 0.955, FILL = 0.43;
const uLevel = { value: -LIQ_R + 2 * LIQ_R * FILL };
const uLiquidOpacity = uniform(0.71);
const uOpticalLevel = uniform(uLevel.value);
let liquidShown = true, simulationTime = 0;



// ═══════════════════════════════════════════════════════════════════
//  subsurface scattering
// ═══════════════════════════════════════════════════════════════════

const uScatterDensity = uniform(1.1);
const uScatterColor = uniform(new THREE.Color(0xc4df80));
const uScatterSpread = uniform(0.45);
const liquidMaterial = new THREE.MeshSSSNodeMaterial({
  color: 0xf4ffe6, roughness: 0.035, metalness: 0,
  transmission: 1, thickness: 0.7, ior: 1.333,
  attenuationColor: new THREE.Color(0x9ac73c), attenuationDistance: 1 / 1.15,
  clearcoat: 0, dispersion: 0.015, side: THREE.FrontSide,
});



// ═══════════════════════════════════════════════════════════════════
//  optical depth
// ═══════════════════════════════════════════════════════════════════

const liquidOpticalPath = float(0.12).add(
  uOpticalLevel.sub(positionLocal.y).max(0).mul(1.4)
);
liquidMaterial.thicknessNode = liquidOpticalPath;
const scatterDepth = liquidOpticalPath.mul(uScatterDensity);



// ═══════════════════════════════════════════════════════════════════
//  light absorption
// ═══════════════════════════════════════════════════════════════════

liquidMaterial.transmissionNode = exp(scatterDepth.negate());
liquidMaterial.thicknessColorNode = uScatterColor;
liquidMaterial.thicknessDistortionNode = uScatterSpread;
liquidMaterial.thicknessPowerNode = float(3.8).sub(uScatterSpread.mul(3));
liquidMaterial.thicknessScaleNode = float(2.7);
liquidMaterial.thicknessAmbientNode = float(0.08);
liquidMaterial.thicknessAttenuationNode = exp(scatterDepth.mul(-0.4)).mul(0.7);



// ═══════════════════════════════════════════════════════════════════
//  liquid scene
// ═══════════════════════════════════════════════════════════════════

const liquidRoot = new THREE.Group();
liquidScene.add(liquidRoot);



// ═══════════════════════════════════════════════════════════════════
//  inner shell
// ═══════════════════════════════════════════════════════════════════

const INNER_SCALE = 0.955;
const CAP_ROWS = 26;
const MAX_LIQUID_VERTICES = 180000;
const positions = new Float32Array(MAX_LIQUID_VERTICES * 3);
const liquidNormals = new Float32Array(MAX_LIQUID_VERTICES * 3);
const liquidGeo = new THREE.BufferGeometry();
liquidGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
liquidGeo.setAttribute('normal', new THREE.BufferAttribute(liquidNormals, 3).setUsage(THREE.DynamicDrawUsage));
liquidGeo.setDrawRange(0, 0);

const liquid = new THREE.Mesh(liquidGeo, liquidMaterial);
liquidRoot.add(liquid);

let shellRestPositions, shellRestNormals, shellRadialDirections, innerPositions, innerSurfaceHeights, shellIndices;
let liquidVertexCount = 0, liquidWallVertexCount = 0;
const cutPoints = [];
const cutPointPool = [];
const capSelected = [];
const clipFields = ['x', 'y', 'z', 'nx', 'ny', 'nz'];
const sortCutAngle = (a, b) => a.angle - b.angle;
const clipVertex = () => ({ x: 0, y: 0, z: 0, nx: 0, ny: 1, nz: 0, d: 0, angle: 0 });
const triScratch = Array.from({ length: 3 }, clipVertex);
const crossScratch = Array.from({ length: 3 }, clipVertex);
const clipOutput = [];
const capScratch = Array.from({ length: 4 }, clipVertex);



// ═══════════════════════════════════════════════════════════════════
//  vessel columns
// ═══════════════════════════════════════════════════════════════════

class VesselColumns {
  constructor(cells = 32, extent = 1.14) {
    this.cells = cells; this.extent = extent;
    this.bins = Array.from({ length: cells * cells }, () => new Uint32Array(128));
    this.counts = new Uint16Array(cells * cells);
    this.triangles = new Float64Array(0);
  }
  cell(value) { return Math.max(0, Math.min(this.cells - 1, Math.floor((value + this.extent) * this.cells / (2 * this.extent)))); }
  rebuild(p, indices) {
    if (this.triangles.length !== indices.length * 4) this.triangles = new Float64Array(indices.length * 4);
    this.counts.fill(0);
    const data = this.triangles, n = this.cells;
    for (let f = 0; f < indices.length; f += 3) {
      const a = indices[f] * 3, b = indices[f + 1] * 3, c = indices[f + 2] * 3;
      const x = p[a], y = p[a + 1], z = p[a + 2];
      const ax = p[b] - x, az = p[b + 2] - z, ay = p[b + 1] - y;
      const bx = p[c] - x, bz = p[c + 2] - z, by = p[c + 1] - y;
      const determinant = ax * bz - az * bx;
      if (Math.abs(determinant) < 1e-11) continue;
      const offset = f * 4, inv = 1 / determinant;
      data[offset] = x; data[offset + 1] = z; data[offset + 2] = y;
      data[offset + 3] = ax; data[offset + 4] = az; data[offset + 5] = ay;
      data[offset + 6] = bx; data[offset + 7] = bz; data[offset + 8] = by;
      data[offset + 9] = inv;
      data[offset + 10] = (ay * bz - by * az) * inv;
      data[offset + 11] = (ax * by - bx * ay) * inv;
      const x0 = this.cell(Math.min(x, p[b], p[c])), x1 = this.cell(Math.max(x, p[b], p[c]));
      const z0 = this.cell(Math.min(z, p[b + 2], p[c + 2])), z1 = this.cell(Math.max(z, p[b + 2], p[c + 2]));
      for (let iz = z0; iz <= z1; iz++) for (let ix = x0; ix <= x1; ix++) {
        const cell = iz * n + ix, slot = this.counts[cell]++;

function addNativeColorPicker(folder, label, initialHex, onChange) {
  const blade = folder.addBlade({
    view: 'text',
    label: label,
    parse: (v) => v,
    stringify: (v) => v,
    value: initialHex,
  });
  requestAnimationFrame(() => {
    const textInput = blade.element.querySelector('input[type="text"]');
    if (!textInput) return;
    const colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.value = initialHex;
    colorInput.classList.add('native-color-input');
    colorInput.addEventListener('input', (e) => {
      const hex = e.target.value;
      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;
      onChange(r, g, b);
    });
    textInput.replaceWith(colorInput);
  });
  return blade;
}

    p.array[i + 2] = z + shellRadialDirections[i + 2] * displacement;
    innerPositions[i] = p.array[i] * INNER_SCALE;
    innerPositions[i + 1] = p.array[i + 1] * INNER_SCALE;
    innerPositions[i + 2] = p.array[i + 2] * INNER_SCALE;
  }
  p.needsUpdate = true;
  ball.geometry.computeVertexNormals();
}



// ═══════════════════════════════════════════════════════════════════
//  ripple normals
// ═══════════════════════════════════════════════════════════════════

const uPos = uniformArray(impPos), uAge = uniformArray(impAge), uStr = uniformArray(impStr);
const glassGradient = Fn(([p]) => {
  const total = float(0).toVar(), gradient = vec3(0).toVar();
  Loop({ start: int(0), end: int(MAX), type: 'int' }, ({ i }) => {
    const age = uAge.element(i), strength = uStr.element(i);
    If(age.lessThanEqual(5).and(strength.notEqual(0)), () => {
      const delta = p.sub(uPos.element(i));
      const distance = length(delta).max(0.000001);
      const front = distance.sub(age.mul(uRipSpeed));
      const phase = distance.mul(uRipFreq).sub(age.mul(11));
      const envelope = exp(front.mul(front).mul(uRipWidth.negate()))
        .mul(exp(age.mul(uRipDecay.negate()))).mul(strength);
      const cosine = cos(phase);
      total.addAssign(cosine.mul(envelope));
      const derivative = sin(phase).mul(uRipFreq.negate())
        .sub(front.mul(uRipWidth).mul(2).mul(cosine)).mul(envelope).div(distance);
      gradient.addAssign(delta.mul(derivative));
    });
  });
  const elastic = total.mul(uWobble).div(0.12).tanh();
  return gradient.mul(float(1).sub(elastic.mul(elastic))).mul(uWobble);
});
const glassObjectNormal = Fn(() => {
  const p = attribute('wobbleBasePosition', 'vec3');
  const baseNormal = attribute('wobbleBaseNormal', 'vec3');
  return normalize(baseNormal.sub(glassGradient(p).mul(uNormalAmt)));
})().toVarying('glassElasticNormal');
material.normalNode = transformNormalToView(normalize(glassObjectNormal));



// ═══════════════════════════════════════════════════════════════════
//  pointer interaction
// ═══════════════════════════════════════════════════════════════════

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();



// ═══════════════════════════════════════════════════════════════════
//  hover proxy
// ═══════════════════════════════════════════════════════════════════

const interactionSphere = new THREE.Sphere(new THREE.Vector3(), RADIUS);
const pointerHit = new THREE.Vector3();
const pointerLocal = new THREE.Vector3();
const previousLocal = new THREE.Vector3();
let prev = null, last = 0, dragging = false;

function spawn(local, strength) {
  let slot = 0, oldest = -1;
  for (let i = 0; i < MAX; i++) if (impAge[i] > oldest) { oldest = impAge[i]; slot = i; }
  impPos[slot].copy(local);
  impAge[slot] = 0;
  impStr[slot] = strength;
}

function onMove(e) {
  if (performance.now() - last < 30) return;
  ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  ball.updateWorldMatrix(true, false);
  const hit = raycaster.ray.intersectSphere(interactionSphere, pointerHit);
  if (hit) {
    const local = ball.worldToLocal(pointerLocal.copy(hit));
    const now = performance.now();
    if (now - last > 30) {
      let s = 1.0;
      if (prev) {
        s = THREE.MathUtils.clamp(0.5 + local.distanceTo(prev) * 16, 0.4, 1.8);
      }
      spawn(local, s);
      last = now;
      prev = previousLocal.copy(local);
    }
  } else { prev = null; }
}



// ═══════════════════════════════════════════════════════════════════
//  pointer events
// ═══════════════════════════════════════════════════════════════════

renderer.domElement.addEventListener('pointermove', onMove, { passive: true });
renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; onMove(e); }, { passive: true });
window.addEventListener('pointerup',   () => { dragging = false; }, { passive: true });
window.addEventListener('pointercancel', () => { dragging = false; }, { passive: true });
renderer.domElement.addEventListener('pointerleave', () => { dragging = false; prev = null; }, { passive: true });
window.addEventListener('blur', () => { dragging = false; prev = null; });



// ═══════════════════════════════════════════════════════════════════
//  nested refraction
// ═══════════════════════════════════════════════════════════════════

const bufferSize = renderer.getDrawingBufferSize(new THREE.Vector2());
const liquidTarget = new THREE.RenderTarget(bufferSize.x, bufferSize.y, {
  type: THREE.HalfFloatType, samples: 2,
});
const emptyTarget = new THREE.RenderTarget(bufferSize.x, bufferSize.y, {
  type: THREE.HalfFloatType,
});
const maskTarget = new THREE.RenderTarget(bufferSize.x, bufferSize.y, {
  type: THREE.UnsignedByteType, samples: 2,
});
const maskScene = new THREE.Scene();
maskScene.background = new THREE.Color(0x000000);
const maskMaterial = new THREE.MeshBasicNodeMaterial({ color: 0xffffff, toneMapped: false });
const maskBall = new THREE.Mesh(ball.geometry, maskMaterial);
maskScene.add(maskBall);



// ═══════════════════════════════════════════════════════════════════
//  liquid mask
// ═══════════════════════════════════════════════════════════════════

const containedOpacity = texture(maskTarget.texture, screenUV).r.mul(uLiquidOpacity);
scene.backgroundNode = mix(texture(emptyTarget.texture, screenUV),
  texture(liquidTarget.texture, screenUV), containedOpacity);
const scenePass = pass(scene, camera);
const vignette = float(1).sub(screenUV.sub(0.5).length().mul(0.10));
const postProcessing = new RenderPipeline(renderer);



// ═══════════════════════════════════════════════════════════════════
//  output
// ═══════════════════════════════════════════════════════════════════

postProcessing.outputNode = vec4(scenePass.rgb.mul(vignette), 1);



// ═══════════════════════════════════════════════════════════════════
//  animation loop
// ═══════════════════════════════════════════════════════════════════

const timer = new THREE.Timer();
let previousWobbleActive = true;
let lastMesh = null, lastLevel = NaN, lastMeniscus = NaN, lastGain = NaN, lastShading = NaN;



// ═══════════════════════════════════════════════════════════════════
//  profiling
// ═══════════════════════════════════════════════════════════════════

const profileEnabled = new URLSearchParams(location.search).has('profile');
const profileFrames = new Float64Array(120), profileCPU = new Float64Array(120);
let profileIndex = 0, profilePreviousTime = 0, activeProfileIndex = 0;
const activeProfileFrames = new Float64Array(120), activeProfileCPU = new Float64Array(120);
let resizePending = false;
function animate() {



  // ═══════════════════════════════════════════════════════════════════
  //  drawing buffer size
  // ═══════════════════════════════════════════════════════════════════

  const pixelRatio = renderer.getPixelRatio();
  const frameWidth = Math.floor(window.innerWidth * pixelRatio);
  const frameHeight = Math.floor(window.innerHeight * pixelRatio);
  if (resizePending || liquidTarget.width !== frameWidth || liquidTarget.height !== frameHeight
    || renderer.domElement.width !== frameWidth || renderer.domElement.height !== frameHeight) {
    resizePending = false;
    resizeViewport();
  }
  const frameStart = profileEnabled ? performance.now() : 0;
  const dt = Math.min(timer.update().getDelta(), 0.05);
  for (let i = 0; i < MAX; i++) impAge[i] += dt;

  simulationTime += dt;



  // ═══════════════════════════════════════════════════════════════════
  //  geometry update
  // ═══════════════════════════════════════════════════════════════════

  prepareGlassRipples();
  const wobbleActive = activeGlassRipples.length > 0;
  const settingsChanged = ball.geometry !== lastMesh || uLevel.value !== lastLevel
    || liquidParams.meniscus !== lastMeniscus || liquidParams.wobbleGain !== lastGain || uNormalAmt.value !== lastShading;
  if (wobbleActive || previousWobbleActive || settingsChanged) {
    updateShellGeometry(true);
    vesselColumns.rebuild(innerPositions, shellIndices);
    updateLiquidGeometry(simulationTime);
    lastMesh = ball.geometry; lastLevel = uLevel.value; lastMeniscus = liquidParams.meniscus;
    lastGain = liquidParams.wobbleGain; lastShading = uNormalAmt.value;
  }
  previousWobbleActive = wobbleActive;
  updateBubbles(dt, simulationTime);



  // ═══════════════════════════════════════════════════════════════════
  //  auto rotation
  // ═══════════════════════════════════════════════════════════════════

  if (!dragging) {
    ball.rotation.y += dt * 0.45;
  }
  controls.update();
  liquidRoot.rotation.copy(ball.rotation);



  // ═══════════════════════════════════════════════════════════════════
  //  environment render
  // ═══════════════════════════════════════════════════════════════════

  liquidRoot.visible = false;
  renderer.setRenderTarget(emptyTarget);
  renderer.render(liquidScene, camera);
  liquidRoot.visible = liquidShown;
  renderer.setRenderTarget(liquidTarget);
  renderer.render(liquidScene, camera);
  maskBall.geometry = ball.geometry;
  maskBall.rotation.copy(ball.rotation);
  renderer.setRenderTarget(maskTarget);
  renderer.render(maskScene, camera);
  renderer.setRenderTarget(null);
  postProcessing.render();
  if (profileEnabled) {
    const slot = profileIndex % profileFrames.length;
    profileFrames[slot] = profilePreviousTime ? frameStart - profilePreviousTime : 0;
    profileCPU[slot] = performance.now() - frameStart;
    if (wobbleActive) {
      const activeSlot = activeProfileIndex % 120;
      activeProfileFrames[activeSlot] = profileFrames[slot];
      activeProfileCPU[activeSlot] = profileCPU[slot];
      activeProfileIndex++;
      if (activeProfileIndex >= 60 && activeProfileIndex % 30 === 0) {
        const count = Math.min(120, activeProfileIndex);
        const times = Array.from(activeProfileFrames.subarray(0,count)).sort((a,b) => a-b);
        const cpuTimes = Array.from(activeProfileCPU.subarray(0,count)).sort((a,b) => a-b);
        renderer.domElement.dataset.activeFrameMedianMs = times[Math.floor(count*.5)].toFixed(2);
        renderer.domElement.dataset.activeFrameP95Ms = times[Math.floor(count*.95)].toFixed(2);
        renderer.domElement.dataset.activeCpuMedianMs = cpuTimes[Math.floor(count*.5)].toFixed(2);
        renderer.domElement.dataset.activeCpuP95Ms = cpuTimes[Math.floor(count*.95)].toFixed(2);
      }
    }
    profilePreviousTime = frameStart; profileIndex++;
    if (profileIndex >= 120 && profileIndex % 60 === 0) {
      const frames = Array.from(profileFrames).sort((a,b) => a-b);
      const cpu = Array.from(profileCPU).sort((a,b) => a-b);
      renderer.domElement.dataset.frameMedianMs = frames[60].toFixed(2);
      renderer.domElement.dataset.frameP95Ms = frames[114].toFixed(2);
      renderer.domElement.dataset.cpuMedianMs = cpu[60].toFixed(2);
      renderer.domElement.dataset.cpuP95Ms = cpu[114].toFixed(2);
    }
  }
  requestAnimationFrame(animate);
}

async function init() {
  await renderer.init();
  pmremGen = new THREE.PMREMGenerator(renderer);
  await loadEnvironment();
  rebuildLiquidBounds();
  applyEnvRotation();
  liquidScene.backgroundBlurriness = envParams.blur;
  timer.connect(document);
  timer.update();
  animate();
  document.getElementById('backend').textContent = 'THREE r' + THREE.REVISION + ' · WEBGPU · TSL';
  loaderElement.classList.add('hidden');
}
init().catch(showRendererError);



// ═══════════════════════════════════════════════════════════════════
//  viewport resize
// ═══════════════════════════════════════════════════════════════════

function resizeViewport() {
  renderer.setRenderTarget(null);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.getDrawingBufferSize(bufferSize);
  liquidTarget.setSize(bufferSize.x, bufferSize.y);
  emptyTarget.setSize(bufferSize.x, bufferSize.y);
  maskTarget.setSize(bufferSize.x, bufferSize.y);
  scenePass.setSize(bufferSize.x, bufferSize.y);
}
window.addEventListener('resize', () => { resizePending = true; });
</script>

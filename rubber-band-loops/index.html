function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;

  };

const frac = (x) => x - Math.floor(x);

function profilePoints() {
  const pts = [];
  const add = (x, y) => {
    const last = pts[pts.length - 1];
    if (last && Math.abs(last.x - x) < 1e-6 && Math.abs(last.y - y) < 1e-6) return;
    pts.push(new THREE.Vector2(x, y));
  };
  const arc = (cx, cy, r, a0, a1, segs = 7) => {
    for (let i = 0; i <= segs; i++) {

      add(cx + r * Math.cos(a), cy + r * Math.sin(a));
    }
  };

}



// ═══════════════════════════════════════════════════════════════════
//  Rounded-rectangle annulus profile, counter-clockwise, so LatheGeometry normals point outward.
// ═══════════════════════════════════════════════════════════════════

function annulusProfile(rMean, width, thick, cornerFactor) {
  const ri = rMean - width / 2, ro = rMean + width / 2, h = thick / 2;
  const cr = Math.max(0.0005, Math.min(width, thick) / 2 * Math.min(1, Math.max(0.02, cornerFactor)));
  const { pts, add, arc } = profilePoints();
  add((ri + ro) / 2, -h);
  arc(ro - cr, -h + cr, cr, -Math.PI / 2, 0);
  arc(ro - cr, h - cr, cr, 0, Math.PI / 2);
  arc(ri + cr, h - cr, cr, Math.PI / 2, Math.PI);
  arc(ri + cr, -h + cr, cr, Math.PI, Math.PI * 1.5);
  add((ri + ro) / 2, -h);
  return pts;
}



// ═══════════════════════════════════════════════════════════════════
//  Inner face of the ring only (an open strip, normals pointing at the axis): the opaque "liner"
//  that the transmission pass sees behind the glass.
// ═══════════════════════════════════════════════════════════════════

function linerProfile(rMean, width, thick, cornerFactor) {
  const ri = rMean - width / 2 - 0.004, h = thick / 2;
  const cr = Math.max(0.0005, Math.min(width, thick) / 2 * Math.min(1, Math.max(0.02, cornerFactor)));
  return [new THREE.Vector2(ri, h - cr), new THREE.Vector2(ri, -h + cr)];
}



// ═══════════════════════════════════════════════════════════════════
//  Flat puck with filleted rim (the bronze discs).
// ═══════════════════════════════════════════════════════════════════

function puckProfile(r, thick, filletFactor) {
  const h = thick / 2;
  const f = Math.max(0.0005, Math.min(r * 0.5, h) * Math.min(1, Math.max(0.02, filletFactor)));
  const { pts, add, arc } = profilePoints();
  add(0, -h);
  arc(r - f, -h + f, f, -Math.PI / 2, 0);
  arc(r - f, h - f, f, 0, Math.PI / 2);
  add(0, h);
  return pts;
}



// ═══════════════════════════════════════════════════════════════════
//  LatheGeometry leaves the last profile point's normal unnormalized; fix that.
// ═══════════════════════════════════════════════════════════════════

function lathe(profile, segments) {
  const g = new THREE.LatheGeometry(profile, segments);
  const n = g.attributes.normal, v = new THREE.Vector3();
  for (let i = 0; i < n.count; i++) {
    v.fromBufferAttribute(n, i);
    if (v.lengthSq() > 1e-12) { v.normalize(); n.setXYZ(i, v.x, v.y, v.z); }
  }
  return g;
}



// ═══════════════════════════════════════════════════════════════════
//  Tangent = circumferential direction around the lathe (Y) axis, so anisotropy follows the turning grooves.
// ═══════════════════════════════════════════════════════════════════

function addCircularTangents(g) {
  const pos = g.attributes.position, tan = new Float32Array(pos.count * 4);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), r = Math.hypot(x, z);
    const tx = r > 1e-6 ? -z / r : 1, tz = r > 1e-6 ? x / r : 0;
    tan[i * 4] = tx; tan[i * 4 + 1] = 0; tan[i * 4 + 2] = tz; tan[i * 4 + 3] = 1;

const uIridMin = uniform(180), uIridMax = uniform(520), uIridBands = uniform(3), uIridFlow = uniform(0.15), uTime = uniform(0);
{

// ═══════════════════════════════════════════════════════════════════

const uDiscColor = uniform(new THREE.Color(P.discMat.color));
const uDiscRadius = uniform(1);

const uGrooveRough = uniform(P.discMat.grooveRough);

const uEdgeDark = uniform(P.discMat.edgeDark);

const uRimSharp = uniform(P.discMat.rimSharp);

{



  // ═══════════════════════════════════════════════════════════════════
  //  0 at centre, 1 at rim
  // ═══════════════════════════════════════════════════════════════════

  //  1 on the flat faces, 0 on the rounded edge
  // ═══════════════════════════════════════════════════════════════════

  const face = smoothstep(uRimSharp, float(0.995), normalGeometry.y.abs());

  // ═══════════════════════════════════════════════════════════════════

  const side = float(1).sub(smoothstep(float(0.12), float(0.35), normalGeometry.y.abs()));
  const bevelCol = mix(uRimColor, uSideColor, side);
  const bevelRough = mix(uRimRough, uSideRough, side);

//  Soft floor: every ring whose bulge reaches below y = 0 leaves a dent (x, z, depth) that the floor sinks into.
// ═══════════════════════════════════════════════════════════════════

const MAX_DENTS = 48;

//  tube axis direction on the floor
// ═══════════════════════════════════════════════════════════════════

  Loop(MAX_DENTS, ({ i }) => {
    const e = uDents.element(i);
    const rel = p.sub(e.xy);

    // ═══════════════════════════════════════════════════════════════════

    discStart(k, n) {
      if (!live()) return;
      const s = S(), t = ctx.currentTime, i = Math.round((n - 1 - k) * 0.6);
      const f = noteHz(i, 0);
      const d = (g) => out(g, 0.5, 0.9, 0.25);
      tone('triangle', f, t, 0.004, 0.09 * s.discs, 0.35, d);
      tone('sine', f * 2.01, t, 0.002, 0.04 * s.discs, 0.18, d);
      noiseHit(t, 3200, 6, 0.03 * s.discs, 0.03, (g) => out(g, 0.6, 0.3));
    },
    discStop(k) {
      if (!live()) return;
      const s = S(), t = ctx.currentTime;
      noiseHit(t, 1400 + k * 60, 8, 0.05 * s.discs, 0.05, (g) => out(g, 0.8, 0.25));
      tone('sine', 82.4, t, 0.003, 0.05 * s.discs, 0.12, (g) => out(g, 1));
    },



    // ═══════════════════════════════════════════════════════════════════
    //  continuous controls, once per frame
    // ═══════════════════════════════════════════════════════════════════

    frame(roll, wobble, wobbleSigned) {
      if (!ready) return;
      const s = S(), t = ctx.currentTime;
      rollGain.gain.setTargetAtTime(Math.min(0.12, roll * 0.03) * s.discs, t, 0.08);
      rollFilter.frequency.setTargetAtTime(260 + roll * 90, t, 0.1);
      wobbleGain.gain.setTargetAtTime(Math.min(0.2, wobble * 0.5) * s.impacts, t, 0.03);
      wobbleOsc.frequency.setTargetAtTime(98 * (1 + wobbleSigned * 2.5), t, 0.015);
    },



    // ═══════════════════════════════════════════════════════════════════
    //  ball hits the rings: glass bell + body thump + spring boing, dub throw on hard hits
    // ═══════════════════════════════════════════════════════════════════

    impact(speed, dir, k) {
      if (!live()) return;
      const s = S(), t = ctx.currentTime, v = Math.min(1, speed / 12);
      const f0 = noteHz(Math.round(k * 0.5) + (dir > 0 ? 2 : 0), 1);
      const bell = (g) => out(g, 0.6, 0.7, 0.6);
      [[1, 1], [2.76, 0.5], [5.4, 0.28], [8.93, 0.15]].forEach(([r, a]) => tone('sine', f0 * r, t, 0.002, 0.16 * a * v * s.impacts, 1.6 / r + 0.3, bell));
      noiseHit(t, 180, 1.2, 0.35 * v * s.impacts, 0.18, (g) => out(g, 1, 0.2), 'lowpass');
      const boing = tone('sine', 70 + 60 * v, t, 0.005, 0.25 * v * s.impacts, 0.7, (g) => out(g, 1, 0.5));
      boing.frequency.exponentialRampToValueAtTime(42, t + 0.6);
      if (v > 0.35) dubThrow(v);
    },
    whoosh() {
      if (!live()) return;
      const s = S(), t = ctx.currentTime;
      const f = noiseHit(t, 600, 1.5, 0.12 * s.impacts, 0.35, (g) => out(g, 1, 0.35));
      f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(2400, t + 0.3);
    },
    bounce(v) {
      if (!live() || v < 0.8) return;
      const s = S(), t = ctx.currentTime, a = Math.min(1, v / 8);
      noiseHit(t, 140, 1, 0.3 * a * s.impacts, 0.12, (g) => out(g, 1, 0.15), 'lowpass');
      tone('sine', 60, t, 0.003, 0.2 * a * s.impacts, 0.15, (g) => out(g, 1));
    },
    clink(j) {
      if (!live() || j < 0.3) return;
      const s = S(), t = ctx.currentTime, a = Math.min(1, j / 6);
      const f = 1800 + Math.random() * 900;
      const d = (g) => out(g, 0.7, 0.6, 0.3);
      tone('sine', f, t, 0.001, 0.12 * a * s.impacts, 0.35, d);
      tone('sine', f * 2.43, t, 0.001, 0.05 * a * s.impacts, 0.2, d);
    },
    shatter() {
      if (!live()) return;
      const s = S(), t = ctx.currentTime;
      noiseHit(t, 2600, 0.8, 0.3 * s.impacts, 0.25, (g) => out(g, 1, 0.6, 0.4), 'highpass');
      for (let i = 0; i < 14; i++) {
        const tt = t + Math.random() * 0.22;
        tone('sine', 2200 + Math.random() * 4200, tt, 0.001, (0.03 + Math.random() * 0.04) * s.impacts, 0.06 + Math.random() * 0.12, (g) => out(g, 0.8, 0.5, 0.3));
      }
      dubThrow(0.8);
    },
  };
  return api;
})();

bind(lightFolder, P.light, 'intensity', { min: 0, max: 10, step: 0.05 }, applyLight);
bind(lightFolder, P.light, 'az', { label: 'azimuth', min: -180, max: 180, step: 1 }, applyLight);
bind(lightFolder, P.light, 'el', { label: 'elevation', min: 5, max: 89, step: 1 }, applyLight);
const softFolder = lightFolder.addFolder({ title: 'Soft area shadow (floor)', expanded: false });
bind(softFolder, P.light, 'softSize', { label: 'light size (°)', min: 0.5, max: 90, step: 0.5 }, applyLight);
bind(softFolder, P.light, 'softStrength', { label: 'area shadow', min: 0, max: 1, step: 0.01 }, applyLight);
bind(softFolder, P.light, 'aoStrength', { label: 'contact darkness', min: 0, max: 1, step: 0.01 }, applyLight);
bind(softFolder, P.light, 'aoRadius', { label: 'contact spread', min: 0.01, max: 2, step: 0.01 }, applyLight);
bind(softFolder, P.light, 'mapStrength', { label: 'shadow-map detail', min: 0, max: 1, step: 0.01 }, applyLight);
bind(softFolder, P.light, 'shadowTint', colorOpt({ label: 'shadow colour' }), applyLight);
bind(lightFolder, P.light, 'shadows', { label: 'shadow map' }, applyLight);
bind(lightFolder, P.light, 'type', { options: { VSM: 'VSM', PCF: 'PCF', Basic: 'Basic' } }, applyLight);
bind(lightFolder, P.light, 'radius', { label: 'blur radius', min: 0, max: 40, step: 0.5 }, applyLight);
bind(lightFolder, P.light, 'blurSamples', { label: 'VSM samples', min: 2, max: 32, step: 1 }, applyLight);
bind(lightFolder, P.light, 'bias', { min: -0.01, max: 0.01, step: 0.0001 }, applyLight);
bind(lightFolder, P.light, 'normalBias', { label: 'normal bias', min: 0, max: 0.2, step: 0.001 }, applyLight);



// ═══════════════════════════════════════════════════════════════════
//  floor / background
// ═══════════════════════════════════════════════════════════════════

const floorFolder = pane.addFolder({ title: 'Floor & background', expanded: false });
bind(floorFolder, P.floor, 'centerColor', colorOpt({ label: 'centre' }), applyFloor);
bind(floorFolder, P.floor, 'edgeColor', colorOpt({ label: 'edge' }), applyFloor);
bind(floorFolder, P.floor, 'radius', { label: 'gradient radius', min: 1, max: 40, step: 0.1 }, applyFloor);
bind(floorFolder, P.floor, 'power', { label: 'gradient curve', min: 0.2, max: 4, step: 0.01 }, applyFloor);
bind(floorFolder, P.floor, 'center', { label: 'centre offset', x: { min: -10, max: 10, step: 0.1 }, y: { min: -10, max: 10, step: 0.1 } }, applyFloor);
bind(floorFolder, P.floor, 'shadowStrength', { label: 'shadow strength', min: 0, max: 1, step: 0.01 }, applyFloor);
bind(floorFolder, P.floor, 'soft', { label: 'floor gives way', min: 0, max: 1.5, step: 0.01 }, applyFloor);
bind(floorFolder, P.floor, 'dentSpread', { label: 'dent spread', min: 0, max: 1.5, step: 0.005 });
bind(floorFolder, P.floor, 'dentMargin', { label: 'dent clearance', min: 0, max: 0.1, step: 0.001 });
bind(floorFolder, P.floor, 'dentShade', { label: 'dent shading', min: 0, max: 1, step: 0.01 }, applyFloor);
bind(floorFolder, P.floor, 'background', colorOpt({ label: 'horizon / fog' }), applyBackground);
bind(floorFolder, P.floor, 'fog', {}, applyBackground);
bind(floorFolder, P.floor, 'fogNear', { label: 'fog near', min: 0, max: 60, step: 0.5 }, applyBackground);
bind(floorFolder, P.floor, 'fogFar', { label: 'fog far', min: 1, max: 120, step: 0.5 }, applyBackground);



// ═══════════════════════════════════════════════════════════════════
//  camera
// ═══════════════════════════════════════════════════════════════════

const camFolder = pane.addFolder({ title: 'Camera', expanded: false });
bind(camFolder, P.camera, 'fov', { min: 10, max: 90, step: 0.5 }, applyCamera);
bind(camFolder, P.camera, 'az', { label: 'azimuth', min: -180, max: 180, step: 0.5 }, applyCamera);
bind(camFolder, P.camera, 'el', { label: 'elevation', min: 2, max: 89, step: 0.5 }, applyCamera);
bind(camFolder, P.camera, 'dist', { label: 'distance', min: 2, max: 40, step: 0.05 }, applyCamera);
bind(camFolder, P.camera, 'targetY', { label: 'target height', min: -3, max: 3, step: 0.01 }, applyCamera);
bind(camFolder, P.camera, 'orbit', { label: 'orbit controls' }, applyCamera);
camFolder.addButton({ title: 'Reset camera' }).on('click', () => { Object.assign(P.camera, structuredClone(DEFAULTS.camera)); refreshFolder(camFolder); applyCamera(); });

function applyAll() {
  audio.apply();
  applyBall();
  rebuildGeometry();
  recomputeJitter();
  applyGlass();
  applyDiscMat();
  applyFloor();
  applyLight();
  applyEnv();
  applyBackground();
  resize();
  applyCamera();
  envDirty = true;
}



// ═══════════════════════════════════════════════════════════════════
//  keyboard
// ═══════════════════════════════════════════════════════════════════

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); P.anim.play = !P.anim.play; refreshFolder(animFolder); }
  if (e.key === 'h' || e.key === 'H') pane.hidden = !pane.hidden;
});



// ═══════════════════════════════════════════════════════════════════
//  go
// ═══════════════════════════════════════════════════════════════════

applyAll();


if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { P.anim.play = false; refreshFolder(animFolder); }

let animTime = 0;
let frameDt = 0;
let last = performance.now();
let paneLast = performance.now(), firstFrame = true;

renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (P.anim.play) animTime += dt * P.anim.speed;
  const period = Math.max(0.05, P.anim.period);
  P.anim.phase = frac(animTime / period);

  uTime.value = animTime;
  if (envDirty) regenEnv();
  frameDt = dt;
  updateBalls(dt);
  updateShatters(dt);
  updateInstances(animTime, P.anim.play ? dt * P.anim.speed : 0);
  if (P.camera.orbit) controls.update();
  renderer.render(scene, camera);

  if (firstFrame) { firstFrame = false; document.getElementById('loader').classList.add('hidden'); }
  if (now - paneLast > 500) {
    paneLast = now;
    if (P.anim.play) refreshFolder(phaseBinding);
  }
});
</script>
